domain_packs:
  - project_id: ghostclaw-os
    canonical_role: root_operating_system
    priority: highest
    core_rules:
      - "All routes inherit default routing unless overridden"
      - "Gate policy applies to all projects under this OS"
      - "Every autonomous action must produce a receipt"
    constraints:
      - "No external deploy without explicit gate approval"
      - "Secrets never written to disk or vault"
    known_design_tokens:
      accent: "#00d4aa"
      font_heading: "Inter"
      font_body: "Inter"
      spacing_unit: 4
    build_order:
      - bootstrap_governance
      - register_schemas
      - build_registry
      - deploy_gate_policy
      - verify_integrity
    related_files_paths:
      - ".ghostclaw/policies/*"
      - ".ghostclaw/registry/*"
      - ".ghostclaw/schemas/*"
      - "AGENTS.md"
      - "CLAUSE.md"

