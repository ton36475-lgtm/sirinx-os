<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GhostClaw Layered Build Status</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06070a;
        --panel: rgba(18, 22, 34, 0.92);
        --line: rgba(130, 92, 255, 0.36);
        --text: #f4f7fb;
        --muted: #9ca7ba;
        --violet: #9d7cff;
        --cyan: #62d5ff;
        --danger: #ff6f91;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 20% 16%, rgba(157, 124, 255, 0.18), transparent 30%),
          radial-gradient(circle at 82% 8%, rgba(98, 213, 255, 0.12), transparent 28%),
          var(--bg);
        color: var(--text);
        font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1080px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      .shell {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        overflow: hidden;
      }

      .header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 28px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 48px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .status {
        align-self: flex-start;
        border: 1px solid rgba(98, 213, 255, 0.45);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--cyan);
        white-space: nowrap;
      }

      .panel {
        padding: 28px;
      }

      .summary {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }

      .metric {
        min-height: 82px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.035);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 8px;
        overflow-wrap: anywhere;
      }

      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main id="ghostclaw-layered-build-root" data-uat-root="ghostclaw-layered-build-status">
      <p>Loading GhostClaw layered build status...</p>
    </main>
    <script type="module" src="./layered-build-status-localhost.mjs"></script>
  </body>
</html>
