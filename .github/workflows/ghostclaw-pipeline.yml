# GHOSTCLAW_LOOP_ENGINEERING - GitHub Actions Workflow
# Phase 2F: CI/CD Pipeline Stubs

name: GhostClaw CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint check
        run: pnpm lint
      - name: Type check
        run: pnpm check-types
      - name: Security scan
        run: pnpm security-scan

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: pnpm test --run

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: pnpm build

# Deploy disabled - set DEPLOY_KILL_SWITCH=false in .env to enable