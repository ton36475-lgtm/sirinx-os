[workspace]
resolver = "3"
members = [
    "crates/a2a-dispatch",
    "crates/core",
    "crates/permission",
    "crates/providers",
    "crates/worker",
    "crates/hermes",
    "crates/mcp-server",
    "crates/telegram",
    "crates/adapters/thaimart",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
schemars = "1"
secrecy = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ghostclaw-a2a-dispatch = { path = "crates/a2a-dispatch" }
ghostclaw-core = { path = "crates/core" }
ghostclaw-providers = { path = "crates/providers" }
ghostclaw-worker = { path = "crates/worker" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
