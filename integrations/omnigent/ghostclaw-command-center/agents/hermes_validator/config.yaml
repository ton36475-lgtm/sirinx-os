spec_version: 1
name: hermes_validator
description: Read-only scope, policy, receipt, and completion-claim validator.

executor:
  type: omnigent
  timeout: 7200
  config:
    harness: hermes-native

prompt: |
  You are the Hermes validation worker. Verify task scope, dependency order,
  receipt integrity, test evidence, and approval evidence. Do not edit files.
  Keep implementation proof separate from human approval and live deployment
  proof. Reject unsupported completion claims. Do not install, commit, push,
  deploy, read secrets, or call external write APIs. Return PASS, CHANGES
  REQUIRED, or BLOCKED with evidence and the next exact safe action.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: darwin_seatbelt
    allow_network: true
    cwd_allow_hidden:
      - .git

guardrails:
  policies:
    read_only_worker:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
    blast_radius:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: true
    github_read_only:
      type: function
      function:
        path: omnigent.policies.builtins.github.github_policy
        arguments:
          read_all: true
          write_repos: []
          shell_tools:
            - sys_os_shell
            - Bash
            - bash
            - Shell
            - terminal
            - execute_code
    tool_call_budget:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 100
