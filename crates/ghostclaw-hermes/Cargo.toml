[package]
name = "ghostclaw-hermes"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ghostclaw-hermes"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
ghostclaw-core = { path = "../ghostclaw-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
