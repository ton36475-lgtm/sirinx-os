[package]
name = "ghostclaw-providers"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tracing = "0.1"
async-openai = "0.41"
ollama-rs = "0.3"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }