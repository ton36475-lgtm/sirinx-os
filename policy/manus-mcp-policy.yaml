policy_id: manus-mcp-policy-v1
title: Manus.ai MCP Bridge Operator Policy
parent_policy: line-mcp-operator-policy-v1
effective_date: 2026-07-17
status: draft

target:
  - manus-mcp-bridge (Python MCP server at _A2A_QUEUE/manus-mcp-bridge.py)
  - Manus.ai custom MCP connector (HTTP endpoint)

classification:
  lane: MANUS_MCP_LINE_BRIDGE
  default_gate: YELLOW_APPROVAL_REQUIRED
  auto_approve_default: false
  production_path: SIRINX_WEBHOOK_ONLY via LINE OA

# ── Allowed Actions ───────────────────────────────────────────────────────────
allowed:
  - read_line_profile
  - read_line_user_id
  - draft_line_message
  - inspect_bridge_health
  - inspect_bridge_status
  - create_a2a_packet_for_audit
  - validate_message_payload
  - dry_run_line_send

# ── Blocked Actions ───────────────────────────────────────────────────────────
blocked:
  - line_broadcast
  - line_push
  - line_multicast
  - line_narrowcast
  - line_webhook_activation
  - line_channel_config_mutation
  - bypass_mcp_allowlist
  - read_or_print_secrets
  - store_line_credentials_in_repo
  - automatic_customer_routing
  - production_line_send_without_webhook
  - disable_receipt_logging

# ── Required Controls ─────────────────────────────────────────────────────────
required_controls:
  - mcp_allowlist_only
  - auto_approve_disabled_by_default
  - dry_run_mode_by_default
  - no_secret_logging
  - no_customer_data_in_receipts
  - a2a_packet_per_tool_call
  - env_only_credentials
  - explicit_human_gate_for_live_mode
  - explicit_human_gate_for_broadcast
  - receipt_per_tool_call
  - cors_restricted_to_localhost
  - rate_limit_not_implemented_yet

# ── Environment Defaults ──────────────────────────────────────────────────────
required_environment_defaults:
  SIRINX_MCP_HOST: "127.0.0.1"
  SIRINX_MCP_PORT: "8788"
  SIRINX_MCP_AUTO_APPROVE: "false"
  SIRINX_LINE_MODE: "dry-run"
  SIRINX_LINE_SEND_BLOCKED: "true"

# ── Auto-Approval Rules ───────────────────────────────────────────────────────
auto_approval:
  enabled: false
  conditions: []
  requires_human:
    - live_mode_enabled
    - line_send_message_in_live_mode
    - any_broadcast_attempt
    - configuration_change

# ── Receipt Schema ────────────────────────────────────────────────────────────
receipts_required:
  - manus_mcp_bridge_receipt
  - a2a_packet_receipt
  - line_mcp_operator_policy_receipt
  - prelive_human_approval_receipt

# ── Notes ─────────────────────────────────────────────────────────────────────
notes: |
  This policy governs the Manus.ai ↔ LINE OA MCP bridge connection.
  Auto-approval is disabled by default. LINE sends remain blocked even in dry-run
  until a human explicitly approves the scoped operation.
  Live mode requires manually setting SIRINX_LINE_MODE=live and explicit
  human approval for send operations.
  The bridge is designed for operator/admin tooling and must not replace
  the production LINE webhook path at https://www.sirinx.co/api/line/webhook.
