<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhiteSide — Dev Command Center</title>
<meta name="description" content="WhiteSide Dev Command Center — 9router, OmniRoute, A2A Bridge, Model Providers, Workflow Automation">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── WhiteSide Theme — Clean, Light, Minimal ───────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-page:#f5f6fa;
  --bg-sidebar:#ffffff;
  --bg-card:#ffffff;
  --bg-card-hover:#f8f9fe;
  --bg-accent-light:#eef2ff;
  --border:#e2e5ef;
  --border-active:#c4cbe5;
  --text-primary:#1a1d2e;
  --text-secondary:#6b7194;
  --text-muted:#989db8;
  --accent:#4f6ef7;
  --accent-light:#eef2ff;
  --accent-glow:rgba(79,110,247,.12);
  --green:#22c55e;
  --green-bg:#dcfce7;
  --orange:#f59e0b;
  --orange-bg:#fef3c7;
  --red:#ef4444;
  --red-bg:#fee2e2;
  --blue:#3b82f6;
  --purple:#8b5cf6;
  --radius:12px;
  --radius-sm:8px;
  --radius-xs:4px;
  --font-sans:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --shadow-sm:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.08);
  --transition:.18s ease;
}
html{font-size:15px;scroll-behavior:smooth}
body{
  font-family:var(--font-sans);
  background:var(--bg-page);
  color:var(--text-primary);
  line-height:1.5;
  min-height:100vh;
  display:flex;
}

/* ─── Sidebar ──────────────────────────────────────────────────────── */
.sidebar{
  width:240px;min-height:100vh;
  background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  padding:0;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  z-index:100;
}
.sidebar-brand{
  padding:20px 20px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.sidebar-brand .logo{
  width:32px;height:32px;
  background:var(--accent);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:1rem;
}
.sidebar-brand .brand-text{
  font-weight:700;font-size:1rem;color:var(--text-primary);
}
.sidebar-brand .brand-sub{
  font-size:.68rem;color:var(--text-muted);font-weight:400;
}
.sidebar-nav{padding:12px 10px;flex:1;overflow-y:auto}
.sidebar-section{margin-bottom:16px}
.sidebar-section-title{
  font-size:.68rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text-muted);
  padding:8px 10px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--text-secondary);text-decoration:none;
  font-size:.85rem;font-weight:500;
  transition:var(--transition);cursor:pointer;
}
.nav-item:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.nav-item .icon{width:18px;height:18px;flex-shrink:0}
.nav-item .badge{
  margin-left:auto;font-size:.65rem;padding:1px 8px;border-radius:10px;
  background:var(--accent-light);color:var(--accent);font-weight:600;
  font-family:var(--font-mono);
}
.nav-item .badge.green{background:var(--green-bg);color:var(--green)}
.nav-item .badge.orange{background:var(--orange-bg);color:var(--orange)}
.nav-footer{
  padding:12px 10px;border-top:1px solid var(--border);
  font-size:.72rem;color:var(--text-muted);
  display:flex;align-items:center;gap:8px;
}
.nav-footer .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* ─── Main Content ─────────────────────────────────────────────────── */
.main{flex:1;min-width:0;padding:0}
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(245,246,250,.8);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:12px 28px;display:flex;align-items:center;gap:14px;
  min-height:56px;
}
.topbar-title{font-size:1.1rem;font-weight:700;flex:1}
.topbar-search{
  background:var(--bg-sidebar);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 14px;font-size:.82rem;
  color:var(--text-primary);width:240px;
  font-family:var(--font-sans);
}
.topbar-search:focus{outline:none;border-color:var(--accent)}
.topbar-actions{display:flex;gap:8px}
.topbar-btn{
  padding:7px 14px;border-radius:var(--radius-xs);
  border:1px solid var(--border);background:var(--bg-sidebar);
  color:var(--text-secondary);font-size:.78rem;font-weight:500;
  cursor:pointer;transition:var(--transition);font-family:var(--font-sans);
}
.topbar-btn:hover{border-color:var(--border-active);color:var(--text-primary)}
.topbar-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.topbar-btn.primary:hover{opacity:.9}

.content{padding:24px 28px;max-width:1600px}

/* ─── Stats Row ────────────────────────────────────────────────────── */
.stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:14px;margin-bottom:24px;
}
.stat-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;
  box-shadow:var(--shadow-sm);transition:var(--transition);
}
.stat-card:hover{border-color:var(--border-active);box-shadow:var(--shadow-md)}
.stat-card .label{
  font-size:.68rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text-muted);margin-bottom:4px;
}
.stat-card .value{font-size:1.6rem;font-weight:700;line-height:1.2}
.stat-card .sublabel{font-size:.72rem;color:var(--text-secondary);margin-top:2px}
.stat-card .value.good{color:var(--green)}
.stat-card .value.warn{color:var(--orange)}
.stat-card .value.bad{color:var(--red)}
.stat-card .value.accent{color:var(--accent)}

/* ─── Panels ────────────────────────────────────────────────────────── */
.panels{display:grid;gap:20px}
.panels-2col{grid-template-columns:1fr 1fr}
.panels-3col{grid-template-columns:1fr 1fr 1fr}
.panel-full{grid-column:1/-1}
@media(max-width:1000px){
  .panels-2col,.panels-3col{grid-template-columns:1fr}
}
.panel{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
  overflow:hidden;transition:var(--transition);
}
.panel:hover{box-shadow:var(--shadow-md)}
.panel-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px;border-bottom:1px solid var(--border);
  font-weight:600;font-size:.85rem;
}
.panel-header .icon{width:16px;height:16px;flex-shrink:0;color:var(--accent)}
.panel-header .count-badge{
  margin-left:auto;font-size:.68rem;padding:2px 10px;border-radius:12px;
  background:var(--accent-light);color:var(--accent);font-weight:600;
  font-family:var(--font-mono);
}
.panel-header .refresh-btn{
  background:none;border:none;color:var(--text-muted);
  cursor:pointer;padding:4px;font-size:1rem;
  border-radius:4px;transition:var(--transition);
}
.panel-header .refresh-btn:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.panel-body{padding:16px 20px}

/* ─── Provider Groups ──────────────────────────────────────────────── */
.provider-group{margin-bottom:14px}
.provider-group:last-child{margin-bottom:0}
.provider-head{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;margin-bottom:6px;
  background:var(--bg-accent-light);
  border-radius:var(--radius-sm);
  font-size:.8rem;font-weight:600;color:var(--text-secondary);
}
.provider-head .count{
  font-family:var(--font-mono);margin-left:auto;
  font-size:.7rem;color:var(--text-muted);
}
.model-grid{display:grid;gap:4px}
.model-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:var(--radius-xs);
  transition:var(--transition);
}
.model-row:hover{background:var(--bg-card-hover)}
.model-row .status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.model-row .status-dot.up{background:var(--green)}
.model-row .status-dot.down{background:var(--red)}
.model-row .status-dot.unknown{background:var(--orange)}
.model-row .name{font-size:.82rem;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-row .tag{
  font-size:.62rem;font-weight:600;padding:1px 7px;border-radius:4px;
  font-family:var(--font-mono);
}
.model-row .tag.vip{background:var(--orange-bg);color:var(--orange)}
.model-row .tag.free{background:var(--green-bg);color:var(--green)}
.model-row .tag.paid{background:var(--accent-light);color:var(--accent)}
.model-row .provider-tag{
  font-size:.65rem;color:var(--text-muted);font-family:var(--font-mono);
  padding:1px 6px;background:var(--bg-page);border-radius:4px;
}

/* ─── Bridge Agents ─────────────────────────────────────────────────── */
.agent-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.agent-card{
  display:flex;flex-direction:column;gap:6px;
  padding:12px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg-page);
  transition:var(--transition);
}
.agent-card:hover{border-color:var(--border-active)}
.agent-card .head{display:flex;align-items:center;gap:8px}
.agent-card .head .name{font-weight:600;font-size:.82rem;flex:1}
.agent-card .head .status-tag{
  font-size:.62rem;padding:2px 8px;border-radius:4px;font-weight:600;
}
.agent-card .head .status-tag.online{background:var(--green-bg);color:var(--green)}
.agent-card .head .status-tag.offline{background:var(--red-bg);color:var(--red)}
.agent-card .head .status-tag.standby{background:var(--orange-bg);color:var(--orange)}
.agent-card .meta{
  font-size:.68rem;color:var(--text-muted);
  font-family:var(--font-mono);
}
.agent-card .outbox{
  font-size:.68rem;color:var(--text-secondary);
  display:flex;align-items:center;gap:4px;
}

/* ─── Health Table ─────────────────────────────────────────────────── */
.health-table{width:100%;border-collapse:collapse;font-size:.8rem}
.health-table th{
  text-align:left;padding:8px 12px;
  font-weight:600;color:var(--text-muted);
  font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--border);
}
.health-table td{
  padding:8px 12px;border-bottom:1px solid rgba(226,229,239,.5);
}
.health-table tr:hover td{background:var(--bg-card-hover)}
.health-table .check{width:10px;height:10px;border-radius:50%;display:inline-block}
.health-table .check.pass{background:var(--green)}
.health-table .check.fail{background:var(--red)}
.health-table .check.warn{background:var(--orange)}

/* ─── Buttons & Components ─────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:var(--radius-xs);
  font-size:.78rem;font-weight:600;cursor:pointer;
  transition:var(--transition);border:none;
  font-family:var(--font-sans);
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
.btn-outline:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.btn-sm{padding:5px 10px;font-size:.72rem}

/* ─── Tabs ─────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{
  padding:10px 18px;font-size:.82rem;font-weight:500;
  color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;
  transition:var(--transition);background:none;border-top:none;border-left:none;border-right:none;
  font-family:var(--font-sans);
}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ─── Loading / Empty ──────────────────────────────────────────────── */
.shimmer{
  animation:shimmer 1.5s infinite;
  background:linear-gradient(90deg,var(--bg-page) 25%,var(--bg-card-hover) 50%,var(--bg-page) 75%);
  background-size:200% 100%;
  border-radius:var(--radius-xs);height:14px;margin-bottom:6px;
}
.shimmer:last-child{margin-bottom:0}
.empty-state{
  text-align:center;padding:32px 20px;
  color:var(--text-muted);font-size:.85rem;
}
.empty-state .emoji{font-size:1.8rem;margin-bottom:8px}

/* ─── Status Tags ──────────────────────────────────────────────────── */
.status-row{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(226,229,239,.5);font-size:.82rem;
}
.status-row:last-child{border-bottom:none}
.status-row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-row .dot.green{background:var(--green)}
.status-row .dot.red{background:var(--red)}
.status-row .dot.yellow{background:var(--orange)}
.status-row .label{flex:1;font-weight:500}
.status-row .meta{color:var(--text-muted);font-size:.72rem;font-family:var(--font-mono)}
.status-row .status{font-size:.72rem;font-weight:600}
.status-row .status.ok{color:var(--green)}
.status-row .status.degraded{color:var(--orange)}
.status-row .status.down{color:var(--red)}

/* ─── Toast ────────────────────────────────────────────────────────── */
.toast{position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 20px;
  font-size:.82rem;box-shadow:var(--shadow-lg);
  animation:fadeIn .2s ease;display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(12px);
}
.toast.error{border-left:3px solid var(--red)}
.toast.success{border-left:3px solid var(--green)}
.toast .close-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px 4px}

/* ─── Animations ───────────────────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.panel{animation:fadeIn .3s ease both}
.panel:nth-child(1){animation-delay:.03s}
.panel:nth-child(2){animation-delay:.06s}
.panel:nth-child(3){animation-delay:.09s}
.panel:nth-child(4){animation-delay:.12s}
.panel:nth-child(5){animation-delay:.15s}

/* ─── Scrollbar ────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--border-active)}

/* ─── Responsive ───────────────────────────────────────────────────── */
@media(max-width:768px){
  .sidebar{width:56px}
  .sidebar-brand .brand-text,.sidebar-brand .brand-sub,.sidebar-section-title,.nav-item span{display:none}
  .nav-item{justify-content:center;padding:9px}
  .nav-footer span{display:none}
  .content{padding:16px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ═══ Sidebar ═══ -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="logo">W</div>
    <div>
      <div class="brand-text">WhiteSide</div>
      <div class="brand-sub">Dev Command Center</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-section">
      <div class="sidebar-section-title">Overview</div>
      <a class="nav-item active" data-tab="overview">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="10" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="10" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item" data-tab="models">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><path d="M2 4 h14 M2 9 h14 M2 14 h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Models</span>
        <span class="badge" id="navModelCount">0</span>
      </a>
      <a class="nav-item" data-tab="bridge">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M5 9 h8 M9 5 v8" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Bridge</span>
        <span class="badge green" id="navBridgeCount">0</span>
      </a>
      <a class="nav-item" data-tab="providers">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><path d="M2 3 h14 a1 1 0 0 1 1 1 v8 a1 1 0 0 1-1 1 h-7 l-3 2 v-2 h-4 a1 1 0 0 1-1-1 v-8 a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Providers</span>
      </a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Automation</div>
      <a class="nav-item" data-tab="workflows">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><path d="M2 12 l4-4 l4 4 l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Workflows</span>
      </a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">System</div>
      <a class="nav-item" data-tab="health">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M9 4 v5 l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Health</span>
      </a>
      <a class="nav-item" data-tab="logs">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 6 h8 M5 9 h8 M5 12 h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Logs</span>
      </a>
    </div>
  </nav>
  <div class="nav-footer">
    <span class="status-dot"></span>
    <span id="footerStatus">All systems nominal</span>
  </div>
</aside>

<!-- ═══ Main ═══ -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="pageTitle">Dashboard</div>
    <input class="topbar-search" type="text" id="globalSearch" placeholder="Search models, agents, providers…">
    <div class="topbar-actions">
      <button class="topbar-btn" id="refreshBtn" onclick="refreshAll()">⟳ Refresh</button>
      <button class="topbar-btn primary" onclick="window.open('https://dev.sirinx.co/9router','_blank')">9Router</button>
    </div>
  </div>

  <div class="content" id="tabContent">
    <!-- Rendered dynamically by JavaScript -->
  </div>
</div>

<!-- ═══ Templates ═══ -->
<template id="tmpl-overview">
  <div class="stats-row" id="statsRow"></div>
  <div class="panels panels-2col">
    <div class="panel">
      <div class="panel-header">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="10" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="10" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
        Top Models
        <span class="count-badge" id="ovTopModelCount">0</span>
      </div>
      <div class="panel-body" id="ovTopModels"><div class="shimmer" style="width:70%"></div><div class="shimmer" style="width:50%"></div></div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M5 9 h8 M9 5 v8" stroke="currentColor" stroke-width="1.5"/></svg>
        Bridge Agents
        <span class="count-badge" id="ovBridgeCount">0</span>
      </div>
      <div class="panel-body" id="ovBridge"><div class="shimmer" style="width:60%"></div><div class="shimmer" style="width:80%"></div></div>
    </div>
    <div class="panel panel-full">
      <div class="panel-header">
        <svg class="icon" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M9 4 v5 l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        System Health
        <span class="count-badge" id="ovHealthCount">0</span>

// ─── Tab Routing ────────────────────────────────────────────────────
const tabs = ['overview','models','bridge','providers','workflows','health','logs'];
let activeTab = 'overview';

document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
  el.addEventListener('click', () => switchTab(el.dataset.tab));
});

function switchTab(tab) {
  if (!tabs.includes(tab)) return;
  activeTab = tab;
  document.querySelectorAll('.nav-item[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  
  const titles = {overview:'Dashboard',models:'Model Browser',bridge:'A2A Bridge',providers:'Providers',workflows:'Workflows',health:'System Health',logs:'System Logs'};
  document.getElementById('pageTitle').textContent = titles[tab] || 'Dashboard';
  
  const content = document.getElementById('tabContent');
  const tmpl = document.getElementById(`tmpl-${tab}`);
  if (!tmpl) { content.innerHTML = '<div class="empty-state">Section coming soon</div>'; return; }
  content.innerHTML = tmpl.innerHTML;
  
  // Load data for tab
  switch(tab) {
    case 'overview': loadOverview(); break;
    case 'models': loadModels(); break;
    case 'bridge': loadBridge(); break;
    case 'providers': loadProviders(); break;
    case 'health': loadHealth(); break;
    case 'logs': loadLogs(); break;
  }
}

// ─── API Helpers ────────────────────────────────────────────────────
async function apiFetch(path) {
  try {
    const resp = await fetch(`${API_BASE}${path}`, { headers: { 'Content-Type':'application/json' } });
    return await resp.json();
  } catch(e) {
    return { error: true, message: e.message };
  }
}

function showToast(msg, type='success') {
  const t = document.querySelector('.toast'); if(t) t.remove();
  const el = document.createElement('div'); el.className=`toast ${type}`;
  el.innerHTML=`<span>${msg}</span><button class="close-btn" onclick="this.parentElement.remove()">✕</button>`;
  document.body.appendChild(el); setTimeout(()=>el.remove(),4000);
}

// ─── Models ──────────────────────────────────────────────────────────
async function loadModels() {
  const data = await apiFetch('/models');
  state.models = data.models || [];
  state.providers = data.providers || [];
  
  document.getElementById('mdlCount').textContent = state.providers.reduce((s,p) => s + (p.models||[]).length, 0);
  
  if (!state.providers.length) {
    document.getElementById('mdlPanelBody').innerHTML = '<div class="empty-state"><div class="emoji">🔌</div>OmniRoute offline. Models cached from SYSTEM_MEMORY_MASTER.md</div>';
    return;
  }
  
  let html = '';
  for (const provider of state.providers) {
    const models = provider.models || [];
    html += `<div class="provider-group"><div class="provider-head"><span>${provider.provider||'Unknown'}</span><span class="count">${models.length} models</span></div><div class="model-grid">`;
    for (const model of models) {
      html += `<div class="model-row">
        <span class="status-dot up"></span>
        <span class="name">${model.id||model.name||model}</span>
        <span class="tag ${model.isVip?'vip':model.isFree?'free':'paid'}">${model.isVip?'VIP':model.isFree?'FREE':'PAID'}</span>
        ${model.provider ? `<span class="provider-tag">${model.provider}</span>` : ''}
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById('mdlPanelBody').innerHTML = html;
  
  // Tab switching for model categories
  document.querySelectorAll('#modelTabs .tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('#modelTabs .tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      // Filter logic could be added here
    });
  });
}

// ─── Global Refresh ──────────────────────────────────────────────────
function refreshAll() {
  showToast('⟳ Refreshing all panels...');
  loadOverview();
  if (activeTab === 'models') loadModels();
  if (activeTab === 'bridge') loadBridge();
  if (activeTab === 'providers') loadProviders();
  if (activeTab === 'health') loadHealth();
}

// ─── Global Search ──────────────────────────────────────────────────
document.getElementById('globalSearch')?.addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('.model-row, .agent-card, .status-row').forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});

// ─── Init ────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  switchTab('overview');
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'r' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); refreshAll(); }
});
</script>
</body>
</html>
