<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhiteSide — Dev Command Center</title>
<meta name="description" content="WhiteSide Dev Command Center — 9router, OmniRoute, A2A Bridge, Agent Fleet, Workflow Automation">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ WhiteSide Cyberpunk Dark Theme ═══════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-page:#0b0d17;
  --bg-page2:#0f1222;
  --bg-sidebar:#0d0f1e;
  --bg-card:#12152a;
  --bg-card-hover:#191d3a;
  --bg-accent-light:rgba(79,110,247,.12);
  --border:#1e2348;
  --border-active:#3b45a0;
  --text-primary:#e0e4f0;
  --text-secondary:#8890b0;
  --text-muted:#5a6288;
  --accent:#4f6ef7;
  --accent-glow:rgba(79,110,247,.25);
  --accent-2:#8b5cf6;
  --cyber:#00f0ff;
  --cyber-dark:rgba(0,240,255,.12);
  --green:#22c55e;
  --green-bg:rgba(34,197,94,.15);
  --green-glow:rgba(34,197,94,.3);
  --orange:#f59e0b;
  --orange-bg:rgba(245,158,11,.15);
  --red:#ef4444;
  --red-bg:rgba(239,68,68,.15);
  --blue:#3b82f6;
  --blue-bg:rgba(59,130,246,.12);
  --purple:#a78bfa;
  --purple-bg:rgba(139,92,246,.12);
  --pink:#ec4899;
  --radius:14px;
  --radius-sm:9px;
  --radius-xs:5px;
  --font-sans:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 4px 20px rgba(0,0,0,.4);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5),0 0 0 1px rgba(79,110,247,.08);
  --shadow-glow:0 0 24px rgba(79,110,247,.12);
  --transition:.18s ease;
  --scanline:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(79,110,247,.015) 2px,rgba(79,110,247,.015) 4px);
}
html{font-size:15px;scroll-behavior:smooth}
body{
  font-family:var(--font-sans);
  background:var(--bg-page);
  color:var(--text-primary);
  line-height:1.5;
  min-height:100vh;
  display:flex;
  position:relative;
}
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background:var(--scanline);
  pointer-events:none;z-index:9999;opacity:.4;
}

/* ─── Sidebar ──────────────────────────────────────────────────── */
.sidebar{
  width:240px;min-height:100vh;
  background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  padding:0;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  z-index:100;
}
.sidebar-brand{
  padding:20px 20px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.sidebar-brand .logo{
  width:32px;height:32px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:1rem;
  box-shadow:0 0 12px var(--accent-glow);
}
.sidebar-brand .brand-text{
  font-weight:700;font-size:1rem;color:var(--text-primary);
}
.sidebar-brand .brand-sub{
  font-size:.68rem;color:var(--text-muted);font-weight:400;
}
.sidebar-nav{padding:12px 10px;flex:1;overflow-y:auto}
.sidebar-section{margin-bottom:16px}
.sidebar-section-title{
  font-size:.68rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text-muted);
  padding:8px 10px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--text-secondary);text-decoration:none;
  font-size:.85rem;font-weight:500;
  transition:var(--transition);cursor:pointer;
}
.nav-item:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.nav-item.active{background:var(--bg-accent-light);color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.nav-item .icon{width:18px;height:18px;flex-shrink:0}
.nav-item .badge{
  margin-left:auto;font-size:.65rem;padding:1px 8px;border-radius:10px;
  background:var(--bg-accent-light);color:var(--accent);font-weight:600;
  font-family:var(--font-mono);
}
.nav-item .badge.green{background:var(--green-bg);color:var(--green)}
.nav-item .badge.orange{background:var(--orange-bg);color:var(--orange)}
.nav-item .badge.cyan{background:var(--cyber-dark);color:var(--cyber)}
.nav-footer{
  padding:12px 10px;border-top:1px solid var(--border);
  font-size:.72rem;color:var(--text-muted);
  display:flex;align-items:center;gap:8px;
}
.nav-footer .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green-glow)}

/* ─── Main Content ─────────────────────────────────────────────── */
.main{flex:1;min-width:0;padding:0}
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(11,13,23,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:12px 28px;display:flex;align-items:center;gap:14px;
  min-height:56px;
}
.topbar-title{font-size:1.1rem;font-weight:700;flex:1}
.topbar-search{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 14px;font-size:.82rem;
  color:var(--text-primary);width:220px;
  font-family:var(--font-sans);
}
.topbar-search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.topbar-actions{display:flex;gap:8px}
.topbar-btn{
  padding:7px 14px;border-radius:var(--radius-xs);
  border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);font-size:.78rem;font-weight:500;
  cursor:pointer;transition:var(--transition);font-family:var(--font-sans);
}
.topbar-btn:hover{border-color:var(--border-active);color:var(--text-primary);background:var(--bg-card-hover)}
.topbar-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.topbar-btn.primary:hover{box-shadow:0 0 16px var(--accent-glow);opacity:.95}
.topbar-btn.cyan{background:rgba(0,240,255,.1);color:var(--cyber);border-color:rgba(0,240,255,.2)}
.topbar-btn.cyan:hover{background:rgba(0,240,255,.18);box-shadow:0 0 12px rgba(0,240,255,.15)}

.content{padding:24px 28px;max-width:1600px}

/* ─── Stats Row ────────────────────────────────────────────────── */
.stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:14px;margin-bottom:24px;
}
.stat-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;
  box-shadow:var(--shadow-sm);transition:var(--transition);
  position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.5;
}
.stat-card:hover{border-color:var(--border-active);box-shadow:var(--shadow-md),var(--shadow-glow)}
.stat-card .label{
  font-size:.68rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text-muted);margin-bottom:4px;
}
.stat-card .value{font-size:1.6rem;font-weight:700;line-height:1.2}
.stat-card .sublabel{font-size:.72rem;color:var(--text-secondary);margin-top:2px}
.stat-card .value.good{color:var(--green);text-shadow:0 0 20px var(--green-glow)}
.stat-card .value.warn{color:var(--orange)}
.stat-card .value.bad{color:var(--red)}
.stat-card .value.accent{color:var(--accent)}
.stat-card .value.cyber{color:var(--cyber)}
.stat-card .value.purple{color:var(--purple)}

/* ─── Panels (CSS Grid) ───────────────────────────────────────── */
.panels{display:grid;gap:20px}
.panels-2col{grid-template-columns:1fr 1fr}
.panels-3col{grid-template-columns:1fr 1fr 1fr}
.panels-4col{grid-template-columns:1fr 1fr 1fr 1fr}
.panel-full{grid-column:1/-1}
@media(max-width:1200px){
  .panels-4col{grid-template-columns:1fr 1fr}
}
@media(max-width:1000px){
  .panels-2col,.panels-3col,.panels-4col{grid-template-columns:1fr}
}
.panel{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
  overflow:hidden;transition:var(--transition);
  position:relative;
}
.panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--border-active),transparent);
  opacity:.3;
}
.panel:hover{box-shadow:var(--shadow-md),var(--shadow-glow);border-color:var(--border-active)}
.panel-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px;border-bottom:1px solid var(--border);
  font-weight:600;font-size:.85rem;
}
.panel-header .icon{width:16px;height:16px;flex-shrink:0;color:var(--accent)}
.panel-header .count-badge{
  margin-left:auto;font-size:.68rem;padding:2px 10px;border-radius:12px;
  background:var(--bg-accent-light);color:var(--accent);font-weight:600;
  font-family:var(--font-mono);
}
.panel-header .refresh-btn{
  background:none;border:none;color:var(--text-muted);
  cursor:pointer;padding:4px;font-size:1rem;
  border-radius:4px;transition:var(--transition);
}
.panel-header .refresh-btn:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.panel-body{padding:16px 20px}

/* ─── Provider Groups ──────────────────────────────────────────── */
.provider-group{margin-bottom:14px}
.provider-group:last-child{margin-bottom:0}
.provider-head{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;margin-bottom:6px;
  background:var(--bg-accent-light);
  border-radius:var(--radius-sm);
  font-size:.8rem;font-weight:600;color:var(--text-secondary);
}
.provider-head .count{
  font-family:var(--font-mono);margin-left:auto;
  font-size:.7rem;color:var(--text-muted);
}
.model-grid{display:grid;gap:4px}
.model-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:var(--radius-xs);
  transition:var(--transition);
}
.model-row:hover{background:var(--bg-card-hover)}
.model-row .status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.model-row .status-dot.up{background:var(--green);box-shadow:0 0 6px var(--green-glow)}
.model-row .status-dot.down{background:var(--red)}
.model-row .status-dot.unknown{background:var(--orange)}
.model-row .name{font-size:.82rem;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-row .tag{
  font-size:.62rem;font-weight:600;padding:1px 7px;border-radius:4px;
  font-family:var(--font-mono);
}
.model-row .tag.vip{background:var(--orange-bg);color:var(--orange)}
.model-row .tag.free{background:var(--green-bg);color:var(--green)}
.model-row .tag.paid{background:var(--bg-accent-light);color:var(--accent)}
.model-row .provider-tag{
  font-size:.65rem;color:var(--text-muted);font-family:var(--font-mono);
  padding:1px 6px;background:var(--bg-page);border-radius:4px;
}

/* ─── Agent Grid ───────────────────────────────────────────────── */
.agent-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.agent-card{
  display:flex;flex-direction:column;gap:6px;
  padding:12px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg-page2);
  transition:var(--transition);position:relative;overflow:hidden;
}
.agent-card::before{
  content:'';position:absolute;top:0;left:0;width:3px;height:100%;
  border-radius:0 2px 2px 0;
}
.agent-card.status-running::before{background:var(--green);box-shadow:0 0 8px var(--green-glow)}
.agent-card.status-standby::before{background:var(--orange)}
.agent-card.status-stopped::before{background:var(--red)}
.agent-card:hover{border-color:var(--border-active);transform:translateY(-1px)}
.agent-card .head{display:flex;align-items:center;gap:8px}
.agent-card .head .name{font-weight:600;font-size:.82rem;flex:1}
.agent-card .head .status-tag{
  font-size:.62rem;padding:2px 8px;border-radius:4px;font-weight:600;
  font-family:var(--font-mono);
}
.agent-card .head .status-tag.running{background:var(--green-bg);color:var(--green)}
.agent-card .head .status-tag.standby{background:var(--orange-bg);color:var(--orange)}
.agent-card .head .status-tag.stopped{background:var(--red-bg);color:var(--red)}
.agent-card .meta{
  font-size:.68rem;color:var(--text-muted);
  font-family:var(--font-mono);
}
.agent-card .outbox{
  font-size:.68rem;color:var(--text-secondary);
  display:flex;align-items:center;gap:4px;
}
.agent-card .skills{
  display:flex;gap:3px;flex-wrap:wrap;margin-top:2px;
}
.agent-card .skills .skill-tag{
  font-size:.6rem;padding:1px 6px;border-radius:3px;
  background:var(--bg-accent-light);color:var(--accent);
  font-family:var(--font-mono);
}

/* ─── Health Table ─────────────────────────────────────────────── */
.health-table{width:100%;border-collapse:collapse;font-size:.8rem}
.health-table th{
  text-align:left;padding:8px 12px;
  font-weight:600;color:var(--text-muted);
  font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--border);
}
.health-table td{
  padding:8px 12px;border-bottom:1px solid rgba(30,35,72,.5);
}
.health-table tr:hover td{background:var(--bg-card-hover)}
.health-table .check{width:10px;height:10px;border-radius:50%;display:inline-block}
.health-table .check.pass{background:var(--green);box-shadow:0 0 6px var(--green-glow)}
.health-table .check.fail{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,.3)}
.health-table .check.warn{background:var(--orange);box-shadow:0 0 6px rgba(245,158,11,.3)}

/* ─── Buttons & Components ─────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:var(--radius-xs);
  font-size:.78rem;font-weight:600;cursor:pointer;
  transition:var(--transition);border:none;
  font-family:var(--font-sans);
}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.btn-primary:hover{box-shadow:0 0 16px var(--accent-glow);opacity:.95}
.btn-cyan{background:rgba(0,240,255,.12);color:var(--cyber);border:1px solid rgba(0,240,255,.2)}
.btn-cyan:hover{background:rgba(0,240,255,.2);box-shadow:0 0 12px rgba(0,240,255,.15)}
.btn-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.btn-green:hover{background:rgba(34,197,94,.25);box-shadow:0 0 12px var(--green-glow)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
.btn-outline:hover{background:var(--bg-card-hover);color:var(--text-primary)}
.btn-sm{padding:5px 10px;font-size:.72rem}
.btn-xs{padding:3px 8px;font-size:.65rem;border-radius:3px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ─── Tabs ─────────────────────────────────────────────────────── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{
  padding:10px 18px;font-size:.82rem;font-weight:500;
  color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;
  transition:var(--transition);background:none;border-top:none;border-left:none;border-right:none;
  font-family:var(--font-sans);
}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ─── Control Action Buttons Row ───────────────────────────────── */
.action-row{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;
}
.action-row .btn{flex-shrink:0}

/* ─── Command Response Box ─────────────────────────────────────── */
.cmd-response{
  background:var(--bg-page);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;
  font-family:var(--font-mono);font-size:.72rem;
  line-height:1.6;max-height:200px;overflow-y:auto;
  margin-top:8px;color:var(--text-secondary);
}

/* ─── Loading / Empty ──────────────────────────────────────────── */
.shimmer{
  animation:shimmer 1.5s infinite;
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card-hover) 50%,var(--bg-card) 75%);
  background-size:200% 100%;
  border-radius:var(--radius-xs);height:14px;margin-bottom:6px;
}
.shimmer:last-child{margin-bottom:0}
.empty-state{
  text-align:center;padding:32px 20px;
  color:var(--text-muted);font-size:.85rem;
}
.empty-state .emoji{font-size:1.8rem;margin-bottom:8px}

/* ─── Status Rows ──────────────────────────────────────────────── */
.status-row{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(30,35,72,.5);font-size:.82rem;
}
.status-row:last-child{border-bottom:none}
.status-row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-row .dot.green{background:var(--green);box-shadow:0 0 6px var(--green-glow)}
.status-row .dot.red{background:var(--red)}
.status-row .dot.yellow{background:var(--orange)}
.status-row .dot.cyan{background:var(--cyber)}
.status-row .label{flex:1;font-weight:500}
.status-row .meta{color:var(--text-muted);font-size:.72rem;font-family:var(--font-mono)}
.status-row .status{font-size:.72rem;font-weight:600}
.status-row .status.ok{color:var(--green)}
.status-row .status.degraded{color:var(--orange)}
.status-row .status.down{color:var(--red)}

/* ─── Telegram Thread ──────────────────────────────────────────── */
.telegram-thread{
  background:var(--bg-page);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px;
  max-height:300px;overflow-y:auto;font-size:.78rem;
}
.msg-row{
  display:flex;gap:8px;padding:6px 8px;margin-bottom:4px;
  border-radius:var(--radius-xs);
}
.msg-row:hover{background:var(--bg-card-hover)}
.msg-row .sender{font-weight:600;color:var(--accent);min-width:70px;font-size:.72rem}
.msg-row .text{color:var(--text-primary);flex:1}
.msg-row .time{color:var(--text-muted);font-size:.62rem;font-family:var(--font-mono);white-space:nowrap}

/* ─── Toast ────────────────────────────────────────────────────── */
.toast{position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 20px;
  font-size:.82rem;box-shadow:var(--shadow-lg);
  animation:fadeIn .2s ease;display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(12px);
}
.toast.error{border-left:3px solid var(--red)}
.toast.success{border-left:3px solid var(--green)}
.toast.warn{border-left:3px solid var(--orange)}
.toast .close-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px 4px}

/* ─── Auto-refresh indicator ───────────────────────────────────── */
.live-indicator{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.68rem;color:var(--text-muted);margin-left:auto;
}
.live-dot{width:5px;height:5px;border-radius:50%;animation:pulse 2s infinite}
.live-dot.on{background:var(--green);box-shadow:0 0 6px var(--green-glow)}
.live-dot.off{background:var(--text-muted);animation:none}

/* ─── Animations ───────────────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.panel{animation:fadeIn .3s ease both}
.panel:nth-child(1){animation-delay:.02s}
.panel:nth-child(2){animation-delay:.04s}
.panel:nth-child(3){animation-delay:.06s}
.panel:nth-child(4){animation-delay:.08s}
.panel:nth-child(5){animation-delay:.10s}
.panel:nth-child(6){animation-delay:.12s}

/* ─── Scrollbar ────────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--border-active)}

/* ─── Responsive ───────────────────────────────────────────────── */
@media(max-width:768px){

  models: [],
  providers: [],
  a2a: null,
  stats: {},
  agents: [],
  tgMessages: [],
  autoRefreshOn: true,
  autoRefreshTimer: null,
  lastRefresh: null,
};

// ─── Tab Routing ────────────────────────────────────────────────────
const tabs = ['overview','models','bridge','providers','omniroute','telegram','workflows','cua','health','logs'];
let activeTab = 'overview';

document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
  el.addEventListener('click', () => switchTab(el.dataset.tab));
});

function switchTab(tab) {
  if (!tabs.includes(tab)) return;
  activeTab = tab;
  document.querySelectorAll('.nav-item[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));

  const titles = {
    overview:'Dashboard', models:'Model Browser', bridge:'A2A Bridge', providers:'Providers',
    omniroute:'OmniRoute', telegram:'Telegram Relay', workflows:'Workflows', cua:'CUA Agent',
    health:'System Health', logs:'System Logs'
  };
  document.getElementById('pageTitle').textContent = titles[tab] || 'Dashboard';

  const content = document.getElementById('tabContent');
  const tmpl = document.getElementById(`tmpl-${tab}`);
  if (!tmpl) { content.innerHTML = '<div class="empty-state">Section coming soon</div>'; return; }
  content.innerHTML = tmpl.innerHTML;

  // Load data for tab
  switch(tab) {
    case 'overview': loadOverview(); break;
    case 'models': loadModels(); break;
    case 'bridge': loadBridge(); loadA2AStatus(); break;
    case 'providers': loadProviders(); break;
    case 'omniroute': loadOmniRoute(); break;
    case 'health': loadHealth(); break;
    case 'logs': loadLogs(); break;
  }
}

// ─── API Helpers ────────────────────────────────────────────────────
async function apiFetch(path) {
  try {
    const resp = await fetch(`${API_BASE}${path}`, { headers: { 'Content-Type':'application/json' } });
    return await resp.json();
  } catch(e) {
    return { error: true, message: e.message };
  }
}

async function apiPost(path, body = {}) {
  try {
    const resp = await fetch(`${API_BASE}${path}`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    });
    return await resp.json();
  } catch(e) {
    return { error: true, message: e.message };
  }
}

function showToast(msg, type='success') {
  const t = document.querySelector('.toast'); if(t) t.remove();
  const el = document.createElement('div'); el.className=`toast ${type}`;
  el.innerHTML=`<span>${msg}</span><button class="close-btn" onclick="this.parentElement.remove()">✕</button>`;
  document.body.appendChild(el); setTimeout(()=>el.remove(),4000);
}

function updateFooterStatus(text, dotClass = 'green') {
  const footer = document.getElementById('footerStatus');
  const dot = document.getElementById('footerDot');
  if (footer) footer.textContent = text;
  if (dot) { dot.className = 'status-dot'; dot.classList.add(dotClass); }
}

// ─── Auto-Refresh ───────────────────────────────────────────────────
function startAutoRefresh() {
  if (state.autoRefreshTimer) clearInterval(state.autoRefreshTimer);
  state.autoRefreshTimer = setInterval(() => {
    if (!state.autoRefreshOn) return;
    // Refresh the current tab's data silently
    switch(activeTab) {
      case 'overview': loadOverview(true); break;
      case 'models': loadModels(true); break;
      case 'bridge': loadBridge(true); loadA2AStatus(true); break;
      case 'omniroute': loadOmniRoute(true); break;
      case 'health': loadHealth(true); break;
    }
  }, AUTO_REFRESH_INTERVAL);
}

function toggleAutoRefresh() {
  state.autoRefreshOn = !state.autoRefreshOn;
  const btn = document.getElementById('autoRefreshToggle');
  if (btn) btn.textContent = state.autoRefreshOn ? '⟳ Live' : '⟳ Paused';
  showToast(state.autoRefreshOn ? 'Auto-refresh enabled (15s)' : 'Auto-refresh paused', state.autoRefreshOn ? 'success' : 'warn');
}

// ─── Models ──────────────────────────────────────────────────────────
async function loadModels(silent) {
  const data = await apiFetch('/models');

  document.getElementById('mdlCount').textContent = state.providers.reduce((s,p) => s + (p.models||[]).length, 0);

    document.getElementById('mdlPanelBody').innerHTML = '<div class="empty-state"><div class="emoji">🔌</div>OmniRoute offline. Models cached from bridge config.</div>';

  let html = '';
  for (const provider of state.providers) {

    html += `<div class="provider-group"><div class="provider-head"><span>${provider.provider||'Unknown'}</span><span class="count">${models.length} models</span></div><div class="model-grid">`;

  document.querySelectorAll('#modelTabs .tab').forEach(tab => {

async function sendTelegramPreset(cmd) {
  const respDiv = document.getElementById('tgResponse');
  const thread = document.getElementById('tgThread');
  if (!respDiv || !thread) return;

  // Add to thread
  const msgEl = document.createElement('div');
  msgEl.className = 'msg-row';
  msgEl.innerHTML = `<span class="sender">→ You</span><span class="text">${cmd}</span><span class="time">now</span>`;
  thread.appendChild(msgEl);
  thread.scrollTop = thread.scrollHeight;

  // Remove empty state
  const empty = thread.querySelector('.empty-state');
  if (empty) empty.remove();

  respDiv.innerHTML = '<div class="cmd-response">Sending command…</div>';

  // Simulate response (would hit Telegram API endpoint)
  setTimeout(() => {
    const respEl = document.createElement('div');
    respEl.className = 'msg-row';
    respEl.innerHTML = `<span class="sender" style="color:var(--cyber)">🤖 Bot</span><span class="text">Command <code style="font-family:var(--font-mono);background:var(--bg-accent-light);padding:1px 5px;border-radius:3px">${cmd}</code> relayed to agent mesh</span><span class="time">now</span>`;
    thread.appendChild(respEl);
    thread.scrollTop = thread.scrollHeight;
    respDiv.innerHTML = `<div class="cmd-response" style="color:var(--green)">✓ Command relayed: ${cmd}</div>`;

    const count = document.getElementById('tgMsgCount');
    if (count) count.textContent = thread.querySelectorAll('.msg-row').length;
  }, 600);
}

// ─── Workflows ──────────────────────────────────────────────────────
function runN8n() {
  showToast('Run `npx n8n start` in terminal to launch n8n', 'success');
}

// ─── Utilities ───────────────────────────────────────────────────────
function formatResult(obj) {
  if (!obj) return 'No response';
  if (typeof obj === 'string') return obj;
  let html = '';
  for (const [key, val] of Object.entries(obj)) {
    if (key === 'error' && val === true) continue;
    const display = typeof val === 'object' ? JSON.stringify(val) : val;
    html += `<span style="color:var(--text-muted)">${key}:</span> ${display}<br>`;
  }
  return html;
}

// ─── Global Refresh ──────────────────────────────────────────────────
function refreshAll() {
  showToast('⟳ Refreshing all panels…');
  loadOverview();
  loadA2AStatus();
  if (activeTab === 'models') loadModels();
  if (activeTab === 'bridge') loadBridge();
  if (activeTab === 'providers') loadProviders();
  if (activeTab === 'omniroute') loadOmniRoute();
  if (activeTab === 'health') loadHealth();
}

// ─── Global Search ──────────────────────────────────────────────────
document.getElementById('globalSearch')?.addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('.model-row, .agent-card, .status-row').forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});

// ─── Init ────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  switchTab('overview');
  loadA2AStatus();
  startAutoRefresh();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'r' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); refreshAll(); }
  if (e.key === 'l' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); toggleAutoRefresh(); }
});

// Page visibility: pause auto-refresh when hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.autoRefreshTimer) {
    clearInterval(state.autoRefreshTimer);
    state.autoRefreshTimer = null;
  } else if (!document.hidden && state.autoRefreshOn) {
    startAutoRefresh();
  }
});
</script>
