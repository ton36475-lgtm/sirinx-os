# ── ROUTING RULES ───────────────────────────────────────────────────────

routing:
  default: hermes
  architecture: [claude, zcode, hermes]
  coding: [codex, kiro, opencode]
  git_ops: [copilot, codex]
  review: [opencode, zcode]
  web: [webmcp, codex]
  planning: [planner, hermes]
  support: [antigravity2, hermes]
  interface: [zai_tui, hermes]
  omni_route: [kiro, hermes]

# ── BRIDGE PEER SYNC ────────────────────────────────────────────────────

sync_groups:
  - name: "build-team"
    members: [codex, kiro, copilot, opencode]
    sync_mode: bidirectional
    interval_seconds: 30
    ws_sync: true

  - name: "architect-team"
    members: [claude, zcode, hermes]
    sync_mode: bidirectional
    interval_seconds: 60
    ws_sync: true

  - name: "standby-pool"
    members: [antigravity2, webmcp, planner, kiro]
    sync_mode: unidirectional
    direction: kiro->standbys
    interval_seconds: 120
    ws_sync: true

  - name: "full-mesh"
    members: [hermes, codex, opencode, zcode, kiro, copilot, claude, antigravity2, webmcp, planner, zai_tui]
    sync_mode: bidirectional
    interval_seconds: 300
    ws_sync: true

# ── TELEGRAM COMMAND INDEX ─────────────────────────────────────────────

telegram:
  enabled: true
  default_target: hermes
  command_prefix: "/"
  commands:
    - command: "/hermes"
      target: hermes
      description: "Talk to Hermes Commander (orchestrator)"
    - command: "/commander"
      target: hermes
      description: "Alias for /hermes"
    - command: "/codex"
      target: codex
      description: "Talk to OpenAI Codex (build captain)"
    - command: "/build"
      target: codex
      description: "Alias for /codex"
    - command: "/opencode"
      target: opencode
      description: "Talk to OpenCode (reviewer)"
    - command: "/review"
      target: opencode
      description: "Alias for /opencode (request code review)"
    - command: "/zcode"
      target: zcode
      description: "Talk to ZCode CLI (safety architect)"
    - command: "/safety"
      target: zcode
      description: "Alias for /zcode (safety review)"
    - command: "/kiro"
      target: kiro
      description: "Talk to Kiro CLI (default builder)"
    - command: "/builder"
      target: kiro
      description: "Alias for /kiro"
    - command: "/copilot"
      target: copilot
      description: "Talk to GitHub Copilot (git assistant)"
    - command: "/git"
      target: copilot
      description: "Alias for /copilot (git operations)"
    - command: "/claude"
      target: claude
      description: "Talk to Claude (chief architect)"
    - command: "/architect"
      target: claude
      description: "Alias for /claude (architecture help)"
    - command: "/antigravity2"
      target: antigravity2
      description: "Talk to Antigravity 2 (support)"
    - command: "/support"
      target: antigravity2
      description: "Alias for /antigravity2"
    - command: "/help"
      target: antigravity2
      description: "Get help from Antigravity 2"
    - command: "/webmcp"
      target: webmcp
      description: "Talk to WebMCP (web automation)"
    - command: "/web"
      target: webmcp
      description: "Alias for /webmcp (browser tasks)"
    - command: "/planner"
      target: planner
      description: "Talk to Planner (strategic planning)"
    - command: "/plan"
      target: planner
      description: "Alias for /planner"
    - command: "/zai"
      target: zai_tui
      description: "Talk to ZAI TUI (terminal interface)"
    - command: "/tui"
      target: zai_tui
      description: "Alias for /zai (terminal interface)"
    - command: "/agents"
      target: hermes
      description: "List all agents and their status"
    - command: "/status"
      target: hermes
      description: "Show bridge and sync status"

# ── OMNIROUTE ───────────────────────────────────────────────────────────

omni_route:
  enabled: true
  base_url: "http://127.0.0.1:20128"
  worker_route: "dev.sirinx.co/9router"
  webhook_sync: true
  bridge_mode: "hybrid"
  fallback: "jsonl"
  live_sync:
    enabled: true
    ws_endpoint: "/ws/a2a"
    health_endpoint: "/health"
    health_check_interval: 30

# ── CLOUDFLARE WORKER ───────────────────────────────────────────────────

cloudflare_worker:
  enabled: true
  worker_name: "9router-api"
  routes:
    - pattern: "dev.sirinx.co/9router"
  observability: true
  websocket_routes:
    - pattern: "dev.sirinx.co/9router/ws/a2a"
    - pattern: "dev.sirinx.co/9router/ws/a2a/*"
