# 9Router Bridge Configuration — A2A Model Bridge for all 11 agents
# v3 — Live sync upgrade: all agents running + WebSocket paths + health checks + Telegram
# Cloudflare Worker frontend at wrangler.toml -> OMNIROUTE_BASE_URL

schema_version: "ghostclaw.a2a.model_bridge.v3"
bridge_id: "9router-a2a-bridge"
bridge_ts: "2026-07-26T"
last_sync: ""

# ── WebSocket / Live Sync Endpoint ──────────────────────────────────────
# Unified WebSocket endpoint for real-time agent sync.
live_sync:
  enabled: true
  ws_endpoint: "ws://127.0.0.1:20128/ws/a2a"
  ws_public: "wss://dev.sirinx.co/9router/ws/a2a"
  poll_interval_seconds: 5
  heartbeat_seconds: 30
  max_retries: 3

# ── 11 AGENTS ───────────────────────────────────────────────────────────

agents:
  - id: hermes
    display: "Hermes Commander"
    role: commander
    model: hermes-prime-lite
    provider: ollama
    type: local
    status: running
    outbox: 63
    transport: a2a_outbox
    a2a_path: "/Users/sirinx/sirinx-os/.ghostclaw_runtime/a2a2a/outbox/hermes"
    queue_path: "/Users/sirinx/sirinx-os/.ghostclaw_runtime/queue/hermes"
    skills: [routing, orchestration, tool_capable]
    bridge_tags: [commander, primary]
    # ── Live sync endpoint (WebSocket) ──
    live_sync:
      ws_path: "/ws/a2a/hermes"
      ws_url: "ws://127.0.0.1:20128/ws/a2a/hermes"
      ws_public: "wss://dev.sirinx.co/9router/ws/a2a/hermes"
    # ── Health check ──
    health_check:
      enabled: true
      type: process
      check_command: "pgrep -f 'hermes$'"
      pid_check: true
      outbox_healthy_threshold: 200
      heartbeat_path: "/health/hermes"
      interval_seconds: 15
      timeout_seconds: 5
      retries: 2
    # ── Telegram command mapping ──
    telegram_commands:
      - "/hermes"
      - "/commander"

