<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SIRINX Cloudflare readiness map</title>
  <desc id="desc">A structured map showing sirinx.co routed through Cloudflare to a static command page.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecf4ef"/>
      <stop offset="0.52" stop-color="#f8faf4"/>
      <stop offset="1" stop-color="#dfe9ee"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="#1a5f50"/>
      <stop offset="1" stop-color="#243f8f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1a2420" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#sky)"/>
  <g opacity="0.38" stroke="#88a89a" stroke-width="1">
    <path d="M90 120h1020M90 240h1020M90 360h1020M90 480h1020M90 600h1020"/>
    <path d="M180 70v580M360 70v580M540 70v580M720 70v580M900 70v580M1080 70v580"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="130" y="120" width="940" height="480" rx="34" fill="#ffffff" stroke="#cad8d0"/>
    <rect x="172" y="166" width="856" height="72" rx="18" fill="#16221d"/>
    <circle cx="212" cy="202" r="9" fill="#51b981"/>
    <circle cx="242" cy="202" r="9" fill="#e0a33b"/>
    <circle cx="272" cy="202" r="9" fill="#d45b5b"/>
    <text x="320" y="211" fill="#eff8f2" font-size="28" font-family="ui-sans-serif, system-ui">sirinx.co / cloudflare-ready</text>
    <g transform="translate(185 300)">
      <rect width="190" height="104" rx="18" fill="#eef6f0" stroke="#bdd0c3"/>
      <text x="28" y="44" fill="#183026" font-size="20" font-weight="700" font-family="ui-sans-serif, system-ui">sirinx.co</text>
      <text x="28" y="76" fill="#5d6f66" font-size="16" font-family="ui-sans-serif, system-ui">apex domain</text>
    </g>
    <g transform="translate(505 280)">
      <rect width="190" height="144" rx="22" fill="#fff4dc" stroke="#dfbd7a"/>
      <text x="34" y="50" fill="#734a0b" font-size="22" font-weight="700" font-family="ui-sans-serif, system-ui">Cloudflare</text>
      <text x="34" y="84" fill="#7d6843" font-size="16" font-family="ui-sans-serif, system-ui">DNS + Pages</text>
      <text x="34" y="112" fill="#7d6843" font-size="16" font-family="ui-sans-serif, system-ui">headers + redirects</text>
    </g>
    <g transform="translate(825 300)">
      <rect width="190" height="104" rx="18" fill="#edf2ff" stroke="#bcc8e6"/>
      <text x="28" y="44" fill="#22356b" font-size="20" font-weight="700" font-family="ui-sans-serif, system-ui">Static site</text>
      <text x="28" y="76" fill="#5b647d" font-size="16" font-family="ui-sans-serif, system-ui">dist output</text>
    </g>
    <path d="M380 352h112" stroke="url(#ink)" stroke-width="8" stroke-linecap="round"/>
    <path d="M700 352h112" stroke="url(#ink)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="438" cy="352" r="11" fill="#1f7a4d"/>
    <circle cx="758" cy="352" r="11" fill="#245d9b"/>
    <text x="188" y="520" fill="#52645b" font-size="22" font-family="ui-sans-serif, system-ui">local-only build prepared for Cloudflare setup</text>
    <rect x="187" y="545" width="826" height="2" fill="#d9e3dc"/>
  </g>
</svg>
