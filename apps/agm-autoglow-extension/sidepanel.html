<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGM AUTOGLOW Assistant</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080c14;
        --panel: #101827;
        --panel-2: #162032;
        --line: #263349;
        --gold: #d5ac52;
        --cyan: #3ed7ff;
        --text: #eef4ff;
        --muted: #9ba8ba;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 14px;
        min-width: 320px;
        background: radial-gradient(circle at top, #13223a 0, var(--bg) 42%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
        margin-bottom: 12px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
        letter-spacing: 0;
      }

      h2 {
        font-size: 13px;
        color: var(--cyan);
        margin-top: 3px;
      }

      .status {
        margin-top: 10px;
        display: grid;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 9px 10px;
        color: var(--text);
        background: var(--panel-2);
        font-weight: 700;
        cursor: pointer;
      }

      button.primary {
        color: #06080d;
        background: var(--gold);
        border-color: #f0cf77;
      }

      button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }

      .scene-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: rgba(16, 24, 39, 0.94);
        margin-bottom: 10px;
      }

      .scene-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .scene-title {
        font-size: 13px;
        font-weight: 800;
      }

      .badge {
        color: #061018;
        background: var(--cyan);
        border-radius: 999px;
        padding: 3px 7px;
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }

      .prompt {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        margin-bottom: 10px;
      }

      .scene-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        padding: 16px;
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>AGM AUTOGLOW</h1>
      <h2>Creative Production OS</h2>
      <div class="status" id="page-state">Waiting for Flow page state...</div>
    </header>

    <section class="toolbar">
      <button class="primary" id="load-demo">Load Demo</button>
      <button id="export-pack">Export Pack</button>
    </section>

    <main id="queue" aria-live="polite"></main>

    <script src="sidepanel.js"></script>
  </body>
</html>
