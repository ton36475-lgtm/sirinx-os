# Loop Guard Policy
# Part of: GHOSTCLAW Hermes Commander A2A2A OS v2.0

loop_guard:
  version: "2.0"

  retry_limits:
    max_consecutive_retries: 2
    max_total_retries_per_mission: 5
    max_retries_per_lane: 3

  runtime_limits:
    max_task_runtime_minutes: 60
    max_mission_runtime_minutes: 240
    max_agent_turn_seconds: 120

  circuit_breaker:
    enabled: true
    failure_threshold: 3
    cooldown_seconds: 300
    scope: per_agent  # or per_ship, fleet_wide

  loop_detection:
    same_command_same_args_max: 2
    same_agent_same_error_max: 2
    cyclical_routing_detect: true
    cyclical_routing_action: BLOCK_IMMEDIATELY

  stall_detection:
    no_progress_timeout_seconds: 600
    action: NOTIFY_HERMES

  cost_guard:
    max_spend_per_task_usd: 5
    max_spend_per_mission_usd: 20
    max_api_calls_per_minute: 10
    token_budget_per_agent_turn: 4096

  rate_limits:
    file_writes_per_minute: 30
    git_operations_per_minute: 10
    test_runs_per_minute: 5
    brain_writes_per_minute: 10
    a2a2a_messages_per_minute: 20

  on_breach: BLOCK_AND_NOTIFY_OPERATOR
