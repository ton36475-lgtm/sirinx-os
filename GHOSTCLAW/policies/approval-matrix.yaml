schema: ghostclaw.approval_matrix.v2
metadata:
  last_modified: 2026-06-29
  policy_version: "2.1.0"
  description: "Approval matrix for autonomous mutual approval mode v2"

approval_matrix:
  default_approval_mode: agent_mutual_approval
  human_approval_required: false

  scopes:
    local_scope:
      approval: agent_mutual_approval
      human_approval_required: false
      allowed_actions:
        - read_only
        - runtime_artifact_write
        - code_patch_allowed_path
        - allowed_path_staging
        - source_mutation_allowed_path
        - local_commit_allowed_scope

    staging_scope:
      approval: agent_quorum_approval
      human_approval_required: false
      required_quorum_count: 2
      validators:
        - manus
        - kob

    production_scope:
      approval: auto_block
      human_approval_required: false
      rejection_behavior: fail_silent_on_runtime

  # Backwards compatibility: legacy tier definitions
  tiers:
    T0_auto:
      description: "Always allowed, no approval"
      actions:
        - file_read
        - git_status
        - git_diff
        - git_log
        - brain_query
        - kms_read
        - agent_status
        - mission_status

    T1_lane_scoped:
      description: "Allowed within assigned lane"
      approver: none
      actions:
        - file_write
        - file_delete
        - git_add
        - test_run
        - lint_run
        - typecheck_run
        - build_run

    T2_hermes_approval:
      description: "Requires Hermes Commander approval"
      approver: hermes-commander
      actions:
        - git_commit
        - git_branch_create
        - git_stash
        - file_move_cross_lane
        - cross_lane_write
        - dependency_install
        - new_file_outside_lane
        - brain_write
        - kms_write

    T3_human_approval:
      description: "Requires Human Operator approval"
      approver: human-operator
      actions:
        - git_push
        - git_merge
        - git_rebase
        - deploy
        - cloud_mutation
        - external_api_write
        - customer_message_send
        - paid_api_call
        - package_publish
        - database_migration

    T4_prohibited:
      description: "Never allowed"
      actions:
        - rm_rf_outside_workspace
        - sudo
        - system_shutdown
        - network_scan_external
        - credential_extraction
        - bypass_approval

  role_permissions:
    hermes-commander:
      max_tier: T2
      can_approve: [T0, T1, T2]

    opus-architect:
      max_tier: T1
      can_approve: [T0, T1]
      note: "No repo writes — outputs design docs only via Hermes"

    codex-captain:
      max_tier: T1
      can_approve: [T0, T1]
      note: "Can write within build lane. T2 requires Hermes approval"

    glm-worker:
      max_tier: T1
      can_approve: [T0]
      note: "File writes only within assigned lane, routed through Codex"

    deepseek-worker:
      max_tier: T1
      can_approve: [T0]
      note: "File writes only within assigned lane, routed through Codex"

    kob-validator:
      max_tier: T1
      can_approve: [T0]
      note: "Read + test execution only. No file writes"

  emergency_override:
    enabled: false
    requires: human-operator + hermes-commander
    max_duration_minutes: 15
    audit_required: true
