version: 1
policy_id: connector-operating-policy
status: active-level-1
name: SIRINX Connector Operating Policy
purpose: >
  Keep MCP servers and Codex connectors read-only by default and require explicit
  approval before external writes, exports, pushes, paid actions, or destructive actions.
default_mode: read_only
read_only_allowed:
  - local_file_inspection
  - public_documentation_read
  - connector_metadata_read
  - github_metadata_read
  - supabase_schema_metadata_read
  - notion_metadata_read
  - google_drive_metadata_read
  - clickup_metadata_read
  - figma_metadata_read
  - canva_metadata_read
approval_required:
  - github_push
  - github_pull_request_create
  - github_issue_create
  - github_comment
  - github_workflow_rerun
  - supabase_write
  - supabase_migration
  - supabase_storage_write
  - supabase_auth_mutation
  - notion_write
  - google_drive_write
  - google_drive_share_change
  - clickup_write
  - figma_edit
  - figma_export
  - canva_edit
  - canva_export
  - browser_authenticated_write
  - computer_use_external_action
  - openai_api_key_creation
  - paid_api_call
destructive_or_sensitive_requires_dedicated_gate:
  - delete_operation
  - permission_change
  - cloud_resource_mutation
  - production_deployment
  - customer_facing_send
  - database_migration
  - credential_or_token_change
  - sso_mfa_access_policy_change
forbidden_without_approval:
  - external_write
  - public_export
  - git_push
  - production_deploy
  - customer_message
  - paid_api_call
  - secret_read_or_print
preflight_required_fields:
  - connector
  - target_object
  - write_action
  - reversibility
  - external_visibility
  - paid_usage
  - secret_or_private_data_involvement
  - operator_approval
post_action_report_required_fields:
  - connector
  - action
  - object_changed
  - external_visibility
  - paid_usage
  - secrets_touched
  - result
  - rollback_path
  - evidence
reviewer_verification:
  required: true
  checks:
    - Connector writes were explicitly approved.
    - No secrets were read or printed.
    - External visibility was reported.
    - Paid usage was reported.
    - Rollback path was documented where applicable.
