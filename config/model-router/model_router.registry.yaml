# MaxPlus-AI Dedicated Provider Configuration Matrix
version: "2026.SIRINX.AUTOLOOP"

providers:
  maxplus-free:
    type: "openai_compatible"
    base_url: "https://api.maxplus-ai.cc/v1"
    api_key_env: "MAXPLUS_API_KEY_1"
    api_key_pools:
      - "MAXPLUS_API_KEY_1"
      - "MAXPLUS_API_KEY_2"
    default_headers:
      X-Sovereign-Node: "Phitsanulok-MacMini-Node1"
      X-Fleet-Scope: "SIRINX_ALL_PROJECTS"

models:
  deepseek-v4-pro:
    provider: "maxplus-free"
    model: "maxplus-free/deepseek-v4-pro"
    role: "primary_free_coder"
    context_length: 1000000
    capabilities: [reasoning, tool_call, code_generation]
    free_tier: true
    priority: 1

  glm-5.2:
    provider: "maxplus-free"
    model: "maxplus-free/glm-5.2"
    role: "planning_assistant"
    context_length: 1000000
    capabilities: [reasoning, function_call]
    free_tier: true
    priority: 2

  kimi-k2.7-code:
    provider: "maxplus-free"
    model: "maxplus-free/kimi-k2.7-code"
    role: "long_context_processor"
    context_length: 262144
    capabilities: [tool_call, code_generation]
    free_tier: true
    priority: 3

  moonshot-v1-128k-kimi3:
    provider: "maxplus-free"
    model: "maxplus-free/moonshot-v1-128k"
    role: "chinese_model_pool"
    context_length: 128000
    capabilities: [reasoning, tool_call, code_generation, multilingual_chinese]
    free_tier: true
    priority: 4
    tags: [chinese, kimi3, moonshot, cn_model_pool]

  moonshot-kimi-2.7:
    provider: "maxplus-free"
    model: "maxplus-free/moonshot-v1-256k"
    role: "ultra_long_context"
    context_length: 256000
    capabilities: [reasoning, function_call, long_context, chinese_optimized]
    free_tier: true
    priority: 5
    tags: [chinese, kimi3, moonshot, cn_model_pool]

escalation_chain:
  - maxplus-free/deepseek-v4-pro
  - opencode/deepseek-v4-flash-free
  - maxplus-free/glm-5.2
  - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free

budget_guard:
  mode: "free_first"
  max_task_budget_usd: 2.00
  escalation_threshold_usd: 0.50
  hard_stop_usd: 5.00
  auto_escalate_on_failure: true