# MaxPlus API Configuration
# Updated configuration for Claude CoWork application

# IMPORTANT: Replace ccsk-f5df7ac2b69c70a51068c43bdb6ea0d78d2461fdad30edd7ae658ec189f173f8 with actual API key from maxplus.ai
api_key: "ccsk-f5df7ac2b69c70a51068c43bdb6ea0d78d2461fdad30edd7ae658ec189f173f8"

# Base configuration
base_url: "https://api.maxplus-ai.cc/v1"
timeout_ms: 30000
environment: production

# Available models
models:
  moonshot: "claude-sonnet-5"      # Kimi/Moonshot Chinese model
  glm_5_2: "claude-sonnet-5"            # GLM 5.2 latest Chinese model
  glm_4: "claude-sonnet-5"                # GLM 4.x model
  kimi: "claude-sonnet-5"           # Alternative Kimi name

# Chinese language models
chinese_models:
  - "claude-sonnet-5"
  - "claude-sonnet-5"
  - "claude-sonnet-5"

# Rate limiting
rate_limit:
  requests_per_minute: 60
  tokens_per_minute: 100000
  burst: 10

# Alternative endpoints
endpoints:
  maxplus: "https://api.maxplus-ai.cc/v1"
  glm_direct: "https://api.z.ai/api/paas/v4"
  cointh: "https://api.cointh.ai/v1"

# Provider priority
provider_priority:
  - maxplus
  - glm_direct
  - cointh

# Model routing rules
routing:
  chinese_tasks:
    preferred: "claude-sonnet-5"
    fallback: "claude-sonnet-5"
  
  thai_tasks:
    preferred: "cointh"
    fallback: "claude-sonnet-5"
  
  general_tasks:
    preferred: "claude-sonnet-5"
    fallback: "claude-sonnet-5"

# Claude CoWork integration
claude_cowork:
  enabled: true
  provider: "maxplus"
  model: "claude-sonnet-5"
  timeout: 30000
  max_tokens: 4096
  temperature: 0.7

# Vibe Coding integration
vibe_coding:
  enabled: true
  primary_provider: "maxplus"
  fallback_provider: "glm_direct"
  models:
    codex: "claude-sonnet-5"
    opencode: "claude-sonnet-5"
    hermes: "claude-sonnet-5"